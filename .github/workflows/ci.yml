name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: yarn

      - run: yarn install --immutable
      - run: yarn build --verbose

      - name: Run tests against darts-clone backend
        run: yarn test:coverage
        env:
          NODE_DARTS_DEFAULT_BACKEND: clone

      # Run the darts backend last so the coverage report uploaded to Codecov
      # reflects it (overwrites the previous run's coverage/ output).
      - name: Run tests against darts backend
        run: yarn test:coverage
        env:
          NODE_DARTS_DEFAULT_BACKEND: darts

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-node-darts
          fail_ci_if_error: false
