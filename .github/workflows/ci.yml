name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:wasm
      - run: make format-check

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - run: yarn install --immutable
      - run: yarn build

      - name: Run tests against darts-clone backend
        run: yarn test:coverage
        env:
          NODE_DARTS_TEST_BACKEND: clone

      # Run the darts backend last so the coverage report uploaded to Codecov
      # reflects it (overwrites the previous run's coverage/ output).
      - name: Run tests against darts backend
        run: yarn test:coverage
        env:
          NODE_DARTS_TEST_BACKEND: darts

      - name: Upload coverage to Codecov
        if: matrix.node == '22.23.4'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-node-darts
          fail_ci_if_error: false

  node20-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - name: Round trip on Node 20
        run: |
          node -e "
          const assert = require('node:assert');
          const os = require('node:os');
          const path = require('node:path');
          assert.strictEqual(typeof Symbol.dispose, 'symbol');
          const { Dictionary } = require('./dist/cjs/index.js');
          const file = path.join(os.tmpdir(), 'smoke.darts');
          const built = Dictionary.build([['a', 1], ['ab', 2]]);
          built.saveSync(file);
          built[Symbol.dispose]();
          const d = Dictionary.loadSync(file);
          assert.strictEqual(d.exactMatchSearch('ab'), 2);
          assert.strictEqual(d.commonPrefixSearch('abc').length, 2);
          d[Symbol.dispose]();
          " || exit 1
